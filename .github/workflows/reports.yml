name: Monthly reports

# Writes the monthly report pack for each analyst (Talent, Property, Retail Pricing, Marketplace) on the Analyst server,
# then publishes them to the site's Reports page. Runs on the 1st of every month for the month just ended, and on
# demand for any month (default: this month, month to date). Needs DATABASE_URL, SCRAPPA_API_KEY and ADMIN_TOKEN.
on:
  schedule:
    - cron: "41 5 1 * *"        # 07:41 SAST on the 1st
  workflow_dispatch:
    inputs:
      month:
        description: "YYYY-MM (blank = this month, month to date)"
        default: ""
      force:
        description: "Rewrite reports that already exist"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-index        # never alongside the daily refresh (both commit data)
  cancel-in-progress: false

jobs:
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SCRAPPA_API_KEY: ${{ secrets.SCRAPPA_API_KEY }}
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      API: https://acolyte-site.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Database setup (tables and permissions for reports)
        env:
          ANALYST_DB_PASSWORD: ${{ secrets.ANALYST_DB_PASSWORD }}
        run: |
          python pipeline/db.py
          python - <<'PY'
          import os, psycopg
          import re, sys
          sys.path.insert(0, ".")
          import analyst   # prefer IPv4, as the server does
          for user in ("analyst_web", "analyst_admin"):
              url = re.sub(r"//[^:@/]+:[^@/]*@", f"//{user}:{os.environ['ANALYST_DB_PASSWORD']}@", os.environ["DATABASE_URL"], count=1)
              try:
                  psycopg.connect(url, connect_timeout=15).close()
                  print(f"login {user} with the GitHub ANALYST_DB_PASSWORD: OK")
              except Exception as e:
                  print(f"login {user} with the GitHub ANALYST_DB_PASSWORD: FAILED ({e.__class__.__name__}: {str(e)[-260:]})")
          with psycopg.connect(os.environ["DATABASE_URL"]) as c:
              for priv in ("SELECT", "INSERT", "UPDATE"):
                  print(priv, "on admin.reports for analyst_admin:",
                        c.execute("SELECT has_table_privilege('analyst_admin', 'admin.reports', %s)", (priv,)).fetchone()[0])
          PY

      - name: 12-month search trends for the look-back
        run: python pipeline/fetch_trends.py --long

      - name: Write the reports
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then MONTH=$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m); else MONTH="${{ inputs.month }}"; fi
          FORCE="${{ inputs.force }}"; [ "$FORCE" = "true" ] || FORCE=false
          echo "Month: ${MONTH:-this month}  force: $FORCE"
          for i in $(seq 1 8); do   # wake the server
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$API/health"); echo "health: $code"; [ "$code" = "200" ] && break; sleep 15
          done
          # One report at a time: the server writes each as a long deep-model run and has limited memory.
          # A free Render instance can restart mid-report (redeploy, memory, AI hiccup): retry each report up to 3 times.
          for ind in property retail marketplace jobs; do
            F=$FORCE
            for attempt in 1 2 3; do
              for i in $(seq 1 8); do code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$API/health"); [ "$code" = "200" ] && break; sleep 15; done
              echo "$ind start (attempt $attempt): $(curl -sS --max-time 90 -w ' [HTTP %{http_code}]' -X POST -H "Authorization: Bearer $ADMIN_TOKEN" "$API/admin/reports/$ind/run?month=$MONTH&force=$F")"
              for i in $(seq 1 60); do
                st=$(curl -sS --max-time 60 -H "Authorization: Bearer $ADMIN_TOKEN" "$API/admin/reports/$ind?month=$MONTH" | python3 -c "import json,sys;print(json.load(sys.stdin).get('status'))" 2>/dev/null || echo unknown)
                [ "$st" = "running" ] || [ "$st" = "unknown" ] || break
                sleep 20
              done
              res=$(curl -sS --max-time 60 -H "Authorization: Bearer $ADMIN_TOKEN" "$API/admin/reports/$ind?month=$MONTH")
              echo "$ind done: ${res:0:400}"
              echo "$res" | grep -q '"status": *"ready"' && echo "$res" | grep -q '"error": *null' && break
              F=true; sleep 30
            done
          done

      - name: Publish to the site
        run: |
          python pipeline/export_reports.py
          git config user.name "acolyte-bot"
          git config user.email "acolyte-bot@users.noreply.github.com"
          git add web/public/data/reports
          if git diff --cached --quiet; then echo "No report changes."; else
            git commit -m "Monthly reports $(date -u +%Y-%m-%d)"
            for i in 1 2 3 4; do git pull --rebase origin main && git push && break; sleep $((i * 10)); done
          fi

  deploy:
    needs: reports
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
