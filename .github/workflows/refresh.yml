name: Refresh Automation Index

# Runs the data pipeline every morning: jobs -> Neon -> classify -> companies -> enrich -> tools/skills
# -> CRM drafts -> snapshot.json,
# commits the new snapshot, then redeploys the site to GitHub Pages.
on:
  schedule:
    - cron: "17 4 * * *"   # 06:17 South African time
  workflow_dispatch:
    inputs:
      max_calls:
        description: "Max Adzuna calls this run (blank = one per search term)"
        required: false
      use_claude:
        description: "Use Claude for classification and commentary (needs ANTHROPIC_API_KEY secret)"
        type: boolean
        default: false
      wipe_demo:
        description: "Delete sample data from the database first"
        type: boolean
        default: false
      setup_only:
        description: "Only set up the database (tables, views, analyst login). No fetching, no agents"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-index
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}   # agent harness (Job Scout, Company Researcher)
      AGENT_MODEL: ${{ vars.AGENT_MODEL }}                  # blank = auto (Claude Opus 5.5 if ANTHROPIC_API_KEY, else an OpenRouter model)
      SEARCH_MODEL: ${{ vars.SEARCH_MODEL }}                # model used for OpenRouter web search (blank = AGENT_MODEL)
      AGENT_MAX_COST: ${{ vars.AGENT_MAX_COST || '0.40' }}  # USD cap per agent run
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}   # blank = newest available Gemini Flash
      ADZUNA_CALL_BUDGET: ${{ vars.ADZUNA_CALL_BUDGET || '4800' }}   # paid plan: 5,000 calls a month
      ADZUNA_BUDGET_PERIOD: ${{ vars.ADZUNA_BUDGET_PERIOD || 'month' }}
      ADZUNA_PAGES: ${{ vars.ADZUNA_PAGES || '4' }}                    # 50 ads per page, per role
      WEB_SEARCH_TERMS_PER_RUN: ${{ vars.WEB_SEARCH_TERMS_PER_RUN || '5' }}
      JOB_SEARCH_MODEL: ${{ vars.JOB_SEARCH_MODEL || 'claude-opus-5-5' }}
      # Enrichment + CRM (all optional)
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}            # blank = free DuckDuckGo results page
      ENRICH_PER_RUN: ${{ vars.ENRICH_PER_RUN || '25' }}      # companies researched per run
      FULLTEXT_PER_RUN: ${{ vars.FULLTEXT_PER_RUN || '20' }}  # full ad texts looked up per run
      DRAFTS_PER_RUN: ${{ vars.DRAFTS_PER_RUN || '10' }}      # first-email drafts prepared per run
      ANALYST_DB_PASSWORD: ${{ secrets.ANALYST_DB_PASSWORD }}  # creates the read-only login for the AI analyst
      SENDER_NAME: ${{ vars.SENDER_NAME }}
      SENDER_TITLE: ${{ vars.SENDER_TITLE }}
      SENDER_EMAIL: ${{ vars.SENDER_EMAIL }}
      SENDER_PHONE: ${{ vars.SENDER_PHONE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check secrets
        run: |
          ok=true
          if [ -z "$DATABASE_URL" ]; then echo "::error::Secret DATABASE_URL is missing or empty. Add your Neon connection string under Settings > Secrets and variables > Actions > Repository secrets."; ok=false; fi
          case "$DATABASE_URL" in ""|postgres://*|postgresql://*) ;; *) echo "::error::DATABASE_URL should start with postgresql:// (copy it from Neon > Connect)."; ok=false;; esac
          for k in OPENROUTER_API_KEY ANTHROPIC_API_KEY ADZUNA_APP_ID ADZUNA_APP_KEY BRAVE_API_KEY; do
            if [ -n "${!k}" ]; then echo "$k: set"; else echo "$k: not set (that source is skipped)"; fi
          done
          if [ -z "$OPENROUTER_API_KEY$ANTHROPIC_API_KEY$ADZUNA_APP_KEY" ]; then echo "::warning::No job source key is set (GEMINI_API_KEY, ANTHROPIC_API_KEY or ADZUNA keys), so no new jobs can be found."; fi
          $ok

      - name: Remove sample data
        if: ${{ inputs.wipe_demo }}
        run: python pipeline/seed_demo.py --wipe

      - name: Database setup only
        if: ${{ inputs.setup_only }}
        run: python pipeline/db.py

      - name: Fetch, classify, export
        if: ${{ !inputs.setup_only }}
        run: |
          ARGS=""
          if [ "${{ inputs.use_claude }}" = "true" ] || [ "${{ vars.USE_CLAUDE }}" = "true" ]; then ARGS="$ARGS --claude"; fi
          if [ -n "${{ inputs.max_calls }}" ]; then ARGS="$ARGS --max-calls ${{ inputs.max_calls }}"; fi
          python refresh.py $ARGS

      - name: Commit new snapshot
        run: |
          git config user.name "acolyte-bot"
          git config user.email "acolyte-bot@users.noreply.github.com"
          git add web/public/data/snapshot.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Data refresh $(date -u +%Y-%m-%d)"
            # main may have moved while the pipeline ran: rebase onto it, retry a few times
            for i in 1 2 3 4; do git pull --rebase origin main && git push && break; sleep $((i * 10)); done
          fi

  deploy:
    needs: refresh
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
