name: Sales CRM ranking

# Re-rank the sales CRM's prospects from the latest data and print the top 5 per analyst (names and scores only).
on:
  workflow_dispatch:

jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API: https://acolyte-site.onrender.com
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
    steps:
      - name: Rank and show the top prospects
        run: |
          for i in 1 2 3 4 5 6; do code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$API/health") || true; [ "$code" = "200" ] && break; sleep 20; done
          echo "score: $(curl -sS --max-time 300 -X POST -H "Authorization: Bearer $ADMIN_TOKEN" "$API/admin/sales/score")"
          for a in property retail marketplace jobs; do
            curl -sS --max-time 60 -H "Authorization: Bearer $ADMIN_TOKEN" "$API/admin/sales?analyst=$a" | python3 -c "
          import json, sys
          d = json.load(sys.stdin); print('==', '$a', '(', len(d.get('ranked', [])), 'shown )')
          for p in d.get('ranked', [])[:5]:
              print(f\"  #{p['rank']} {p['name']} [{p['segment']}] score {float(p['score']):.0f}: {(p['reasons'] or [''])[0][:150]}\")"
          done
