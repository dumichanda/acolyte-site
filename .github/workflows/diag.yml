name: Database login diagnostic
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANALYST_DB_PASSWORD: ${{ secrets.ANALYST_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python pipeline/db.py
      - run: |
          python - <<'PY'
          import os, re, sys, psycopg
          from psycopg import sql
          sys.path.insert(0, "."); import analyst
          own = os.environ["DATABASE_URL"]; pw = os.environ["ANALYST_DB_PASSWORD"]
          def login(user):
              url = re.sub(r"//[^:@/]+:[^@/]*@", f"//{user}:{pw}@", own, count=1)
              try:
                  psycopg.connect(url, connect_timeout=15).close(); return "OK"
              except Exception as e:
                  return "FAILED " + str(e).strip().splitlines()[-1][-120:]
          for u in ("analyst_web", "analyst_admin"):
              print("after full setup:", u, login(u))
          PY
