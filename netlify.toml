# Netlify builds the static site from /web. Data comes from web/public/data/snapshot.json,
# which the GitHub Action "Refresh Automation Index" updates every morning.
[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Playwright is only used to make PDF reports locally; Netlify doesn't need the browser.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

# Data refreshes daily: let browsers cache it briefly so visitors see updates quickly.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
